<!DOCTYPE html>
<html>
<head>
  <title>Pig Game</title>
</head>
<body>
  <h1>Pig Game 🐷</h1>
  <button onclick="createRoom()">Create Room</button>

  <script>
    function createRoom() {
      const roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
      window.location.href = `game.html?room=${roomId}`;
    }
  </script>
</body>
</html>
