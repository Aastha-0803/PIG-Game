<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pig Game</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="game-container">
    
        <h1 style="color: azure;">Pig Game</h1>

        <h2 id="winner" style="color:green"></h2>

        <h3 id="player" style="color: azure;"></h3>
        <h3 id="turn" style="color: azure;"></h3>

        <div>
        <input id="roomLink" readonly />
        <button onclick="copyLink()">Copy</button>
        </div>


        <ul id="scores" style="color: azure; text-align: left;"></ul>

        <p id="error" style="color:red"></p>

        <p style="color: azure;">Last Dice Roll:</p>

        <div style="margin-top: 20px;">
        <img id="diceImg" src="dice/dice1.png" width="80"/>
        <div style="margin-top: 10px;">



        <!-- <pre id="output">Connecting...</pre> -->

        <button id="rollBtn">ROLL</button>
        <button id="holdBtn">HOLD</button>
        <button id="restartBtn" onclick="restart()" style="display:none;">RESTART </button>

    </div>


    <script>
        // const output= document.getElementById("output");

        const playerE1= document.getElementById("player");
        const turnE1= document.getElementById("turn");
        const scoresE1= document.getElementById("scores");
        const errorE1= document.getElementById("error");
        const rollBtn= document.getElementById("rollBtn");
        const holdBtn= document.getElementById("holdBtn");

        let myPlayer = null;
        
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get("room");

        const ws = new WebSocket(`ws://localhost:8765/room/${roomId}`);

       const roomUrl = `${window.location.origin}/game.html?room=${roomId}`;
        document.getElementById("roomLink").value = roomUrl;

        function copyLink() {
        navigator.clipboard.writeText(roomUrl);
        alert("Link copied!");
        }

        ws.onmessage = (event) =>{
            const data=JSON.parse(event.data);
            // document.getElementById("dice").innerText = state.last_dice ?? "-";
            errorE1.textContent="";

            if (data.type==="assign"){
                myPlayer = data.player;
                playerE1.textContent = `You are Player ${myPlayer}`;
                return;
            }
            
            if (data.type==="state"){
                renderState(data);
            }
        };

        function restart() {
            ws.send("RESTART");
        }

        function renderState(state){
            scoresE1.innerHTML="";

            state.players.forEach(p => {
                const li = document.createElement('li');
                li.textContent=`${p.name}: ${p.score}`;
                scoresE1.appendChild(li);
            });

            turnE1.textContent=`Current turn: Player ${state.current_player}`;

            const isMyTurn = myPlayer === state.current_player;
            rollBtn.disabled = !isMyTurn;
            holdBtn.disabled = !isMyTurn;

            if (state.last_dice){
                document.getElementById("diceImg").src=
                `dice/dice${state.last_dice}.png`;
            }

            const winnerE1 = document.getElementById("winner");

            if (state.game_over && state.winner){
                winnerE1.textContent = `🎉 Player ${state.winner} wins!`;       
            }
            else{
                winnerE1.textContent = "";
            }

            if (state.game_over) {
                rollBtn.disabled=true;
                holdBtn.disabled=true;
                }

            const restartBtn = document.getElementById("restartBtn");

            if (state.game_over) {
                restartBtn.style.display = "inline-block";
            } else {
                restartBtn.style.display = "none";
            }

        }

        rollBtn.onclick = () => ws.send("ROLL");
        holdBtn.onclick = () => ws.send("HOLD");

    </script>

</body>
</html>
